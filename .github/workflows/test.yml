name: Tests

# PRs only. A `push: branches: [main]` trigger here re-ran every job against a
# commit the PR had already tested green — a flat 2x for no new signal. The
# trade: `main` has no branch protection, so nothing re-tests a merge commit;
# a semantic conflict between two branches that each passed alone now surfaces
# on the next PR rather than immediately. Restore the push trigger if one slips
# through.
#
# This workflow is the fast PR gate. The serial Debug suite, the solar
# numerics rechecks and ThreadSanitizer run in deep-validation.yml instead.
on:
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-generated-sources:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify generated time table
        run: python3 Scripts/generate-time-table.py --check

      - name: Verify generated Delta T tables
        run: python3 Scripts/generate-deltat-table.py --check

      - name: Verify generated nutation table
        run: python3 Scripts/generate-nutation-table.py --check

      - name: Verify generated planet tables
        run: python3 Scripts/generate-planet-tables.py --check

      - name: Verify Saturn source tables and planetary event archives
        run: |
          python3 -m unittest Scripts/test_saturn_ephemeris.py Scripts/reference-data/test_capture_planetary_apsides.py -v
          python3 Scripts/generate-saturn-tables.py --check
          python3 Scripts/reference-data/capture-planetary-apsides.py --check
          python3 Scripts/record-planetary-event-evidence.py --check

      - name: Verify observer-event primary sources and evidence
        run: |
          python3 -m unittest Scripts/test_observer_events.py -v
          python3 Scripts/capture-observer-events.py --check
          python3 Scripts/record-observer-event-evidence.py --check

      - name: Verify generated Moon tables
        run: python3 Scripts/generate-moon-tables.py --check

      - name: Verify DE441 Moon assessment tooling
        run: |
          python3 -m unittest Scripts/test_assess_moon_de441.py Scripts/test_qualify_moon_de441.py Scripts/test_generate_moon_source_fixtures.py Scripts/test_generate_moon_events.py -v
          python3 Scripts/generate-moon-source-fixtures.py --check
          python3 -m unittest Scripts/test_record_moon_full_integration.py -v
          python3 Scripts/record-moon-full-integration.py --check
          python3 -m unittest Scripts/test_generate_moon_de441_full.py -v
          python3 Scripts/generate-moon-de441-full.py --check
          python3 Scripts/generate-moon-events.py --check

      - name: Verify generated Pluto tables
        run: |
          python3 Scripts/generate-pluto-tables.py --check
          python3 -m unittest Scripts/test_qualify_pluto_center.py -v
          python3 Scripts/qualify-pluto-center.py --check
          python3 -m unittest Scripts/test_assess_pluto_de441.py Scripts/test_generate_pluto_de441.py Scripts/test_record_pluto_de441_evidence.py -v
          python3 Scripts/generate-pluto-de441.py --check
          python3 Scripts/record-pluto-de441-evidence.py --check
          python3 -m unittest Scripts/test_capture_pluto_observers.py -v
          python3 Scripts/capture-pluto-observers.py --check

      - name: Verify generated Chiron table
        run: |
          python3 -m unittest Scripts/test_generate_chiron_table.py -v
          python3 Scripts/generate-chiron-table.py --check

      - name: Verify PAL refraction references
        run: |
          python3 -m unittest Scripts/test_capture_pal_refraction.py -v
          python3 Scripts/capture-pal-refraction.py --check

      - name: Verify SOFA star-motion references
        run: |
          python3 -m unittest Scripts/test_capture_sofa_star_motion.py -v
          python3 Scripts/capture-sofa-star-motion.py --check

      - name: Verify generated Jupiter moon series and jup365 runtime
        run: |
          python3 Scripts/generate-jupiter-moon-series.py --check
          python3 -m unittest Scripts/test_galilean_residuals.py Scripts/test_generate_galilean_jup365.py Scripts/test_generate_galilean_jup365_swift.py Scripts/test_measure_galilean_jup365_runtime.py -v
          python3 Scripts/galilean-residuals.py --check
          python3 Scripts/generate-galilean-jup365.py --check
          python3 Scripts/generate-galilean-jup365-swift.py --check
          python3 Scripts/measure-galilean-jup365-runtime.py --check

      - name: Verify long-term precession source and interval bounds
        run: |
          python3 Scripts/generate-long-term-precession.py --check
          python3 Scripts/generate-long-term-precession-fixtures.py --check
          python3 Scripts/qualify-long-term-precession.py --check

      - name: Verify independent reference fixtures
        run: |
          python3 -m unittest Scripts/reference-data/test_build_fixtures.py -v
          python3 Scripts/reference-data/build-fixtures.py --check
          python3 -m unittest Scripts/test_eclipse_event_evidence.py -v
          python3 Scripts/record-eclipse-event-evidence.py --check
          python3 Scripts/svs-lunar-obscuration/replay.py --check
          python3 Scripts/svs-lunar-obscuration/de421_replay.py --check
          python3 -m unittest Scripts/svs-lunar-obscuration/test_replay.py Scripts/svs-lunar-obscuration/test_de421_replay.py -v
          python3 -m unittest Scripts/test_global_solar.py -v
          python3 Scripts/capture-global-solar.py --check
          python3 Scripts/assess-global-solar-radii.py --check
          python3 Scripts/assess-rp1301-g0.py --check
          python3 Scripts/record-global-solar-evidence.py --check
          python3 -m unittest Scripts/test_local_solar.py -v
          python3 Scripts/capture-local-solar.py --check
          python3 Scripts/record-local-solar-evidence.py --check
          python3 -m unittest Scripts/test_transit_evidence.py -v
          python3 Scripts/capture-transit-references.py --check
          python3 Scripts/record-transit-evidence.py --check

  test-macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      # Parallel Release run; the wrapper isolates the suites that change
      # the process-wide Delta T model or rely on wall-clock budgets.
      - name: Test (release)
        run: Scripts/test-with-isolated-timed-suites.sh -c release

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"

      # Parallel Release run; the wrapper isolates the suites that change
      # the process-wide Delta T model or rely on wall-clock budgets.
      - name: Test (release)
        run: Scripts/test-with-isolated-timed-suites.sh -c release

  # The macOS jobs above exercise the shared source, but the iOS/tvOS/watchOS
  # SDKs compile differently (availability, unavailable APIs). Build the library
  # for each declared Apple platform so a platform-specific break is caught here
  # rather than in a consumer's app. These jobs are build-only. The separate iOS
  # runtime job below boots a simulator and checks a published numerical value.
  build-apple-platforms:
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Build (${{ matrix.platform }})
        run: |
          xcodebuild build \
            -scheme AstronomyKit \
            -destination "generic/platform=${{ matrix.platform }}"

  build-clean-consumer:
    name: Build clean downstream consumer
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Build consumer without repository development tooling
        run: |
          test ! -e .dev-tooling
          swift build --package-path Tests/Consumer

  test-ios-runtime:
    name: Test iOS runtime published value
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify candidate revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Select an available iOS Simulator
        id: simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get("isAvailable"):
                      print(f"udid={device['udid']}")
                      raise SystemExit
          raise SystemExit("No available iOS Simulator")
          PY

      - name: Run published-value smoke on iOS
        run: |
          xcodebuild test \
            -scheme AstronomyKit \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:AstronomyKitTests/IOSRuntimeSmokeTests
